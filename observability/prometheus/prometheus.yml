global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "jenkins"
    metrics_path: "/prometheus/"
    static_configs:
      - targets:
          - "controller:8080"
        labels:
          module: "controller"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          module: "telemetry-collector"
