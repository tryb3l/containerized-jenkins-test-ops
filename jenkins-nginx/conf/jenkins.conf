upstream jenkins_controller {
    server controller:8080;
    keepalive 32;
}

upstream grafana_dashboard {
    server grafana:3000;
    keepalive 16;
}

# HTTP (port 80): local healthchecks + redirect browser traffic to HTTPS
server {
    listen       80;
    server_name  _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (port 443): primary Ingress Proxy for Jenkins Controller & Grafana
server {
    listen       443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Rate-limited authentication routes
    location ~ ^/(login|j_spring_security_check) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn addr_conn 32;

        proxy_pass         http://jenkins_controller;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_redirect     http://           https://;
    }

    # Rate-limited webhook triggers
    location ~ ^/(github-webhook|generic-webhook-trigger)(/|$) {
        limit_req zone=webhook_limit burst=20 nodelay;
        limit_conn addr_conn 32;

        proxy_pass         http://jenkins_controller;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  443;
    }

    # Observability Dashboard route (/grafana/)
    location /grafana/ {
        limit_conn addr_conn 64;

        proxy_pass         http://grafana_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    # Controller UI & API routes
    location / {
        limit_conn addr_conn 64;

        proxy_pass         http://jenkins_controller;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_redirect     http://           https://;
        proxy_max_temp_file_size 0;

        proxy_connect_timeout      150;
        proxy_send_timeout         100;
        proxy_read_timeout         100;

        proxy_buffer_size          8k;
        proxy_buffers              4 32k;
        proxy_busy_buffers_size    64k;
        proxy_temp_file_write_size 64k;
    }
}


